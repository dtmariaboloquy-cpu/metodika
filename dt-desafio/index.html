<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DT Desafío</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f7f1e3;font-family:Arial,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:1000;color:#ffd62e}.tag{font-size:12px;letter-spacing:2px;color:#aaa}.card{background:#1d1d1d;border:1px solid #333;border-radius:24px;padding:22px;margin-top:22px}.home{text-align:center;padding-top:12vh}.logo{font-size:88px;font-weight:1000;line-height:.9;color:#ffd62e}.home h1{font-size:34px;margin:18px 0 8px}.home p{color:#bbb;line-height:1.5}.btn{border:0;border-radius:14px;padding:17px 22px;font-size:17px;font-weight:900;cursor:pointer;width:100%;background:#ffd62e;color:#111}.stats{display:flex;justify-content:space-between;margin:14px 0;color:#aaa}.pitch{position:relative;aspect-ratio:1.65;background:#28794b;border:3px solid #d8ead9;border-radius:15px;overflow:hidden;margin:18px 0;background-image:linear-gradient(90deg,transparent 49.5%,#d8ead9 50%,transparent 50.5%)}.pitch:before{content:"";position:absolute;width:25%;aspect-ratio:1;border:2px solid #d8ead9;border-radius:50%;left:37.5%;top:28%}.p{position:absolute;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;font-weight:bold;border:3px solid white;transform:translate(-50%,-50%)}.us{background:#176de5}.them{background:#e33b3b}.ball:after{content:"⚽";position:absolute;font-size:19px;right:-15px;bottom:-12px}.phase{display:inline-block;background:#ffd62e;color:#111;padding:7px 11px;border-radius:8px;font-weight:900;font-size:12px}.question{font-size:23px;line-height:1.25}.answers{display:grid;gap:10px}.answer{background:#292929;border:2px solid #3b3b3b;color:white;border-radius:14px;padding:15px;text-align:left;font-size:16px}.answer.good{border-color:#3bd47f;background:#173c29}.answer.bad{border-color:#f05050;background:#451f1f}.feedback{padding:16px;border-left:4px solid #ffd62e;background:#292929;margin:14px 0;line-height:1.45}.hide{display:none}.result{text-align:center;padding-top:12vh}.score{font-size:72px;color:#ffd62e;font-weight:1000}@media(max-width:520px){.app{padding:14px}.card{padding:16px}.question{font-size:20px}.logo{font-size:70px}}
.celebrate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(255,214,46,.32),transparent 58%);animation:flash 1.1s both}.celebrate.hide{display:none}.hit{text-align:center;animation:pop .75s cubic-bezier(.2,1.5,.5,1)}.hit strong{display:block;font-size:52px;color:#ffd62e;text-shadow:0 5px 0 #111}.hit span{font-size:23px;font-weight:900}.confetti{position:absolute;width:10px;height:24px;background:var(--c);left:var(--x);top:-30px;animation:fall 1.2s ease-in forwards}.streak{color:#ffd62e;font-weight:900}.pitch.success{animation:pitchGlow .8s}.p.success{animation:pulse .7s}.answer.good{animation:correct .6s}@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}@keyframes flash{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}@keyframes pitchGlow{50%{box-shadow:0 0 35px #ffd62e;transform:scale(1.015)}}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.3)}}@keyframes correct{50%{transform:scale(1.035);box-shadow:0 0 25px #3bd47f}}@media(max-width:520px){.hit strong{font-size:40px}.hit span{font-size:19px}}
.home{position:relative;min-height:calc(100vh - 44px);padding:0!important;border-radius:26px;overflow:hidden;background:#050505 url('dt-hero.png') center 25%/cover no-repeat;text-align:left!important;box-shadow:0 24px 70px #000}.home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 22%,rgba(0,0,0,.35) 48%,#090909 77%)}.heroBrand,.homeContent{position:relative;z-index:2}.heroBrand{padding:25px;display:flex;justify-content:space-between;align-items:flex-start}.heroBrand .logo{font-size:54px}.edition{font-size:10px;font-weight:900;letter-spacing:2px;background:#ffd62e;color:#111;padding:7px 10px;border-radius:20px}.homeContent{padding:300px 22px 24px}.homeContent h1{font-size:42px;line-height:.92;margin:0 0 10px;text-transform:uppercase;max-width:520px}.homeContent .tag{color:#ffd62e;font-weight:900}.homeContent>p{color:#ddd;max-width:520px}.modes{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px;max-width:520px}.mode{position:relative;min-height:120px;border:1px solid #444;background:linear-gradient(145deg,#272727,#111);color:white;border-radius:17px;padding:18px;text-align:left;cursor:pointer;overflow:hidden;transition:.25s}.mode:first-child{background:linear-gradient(145deg,#ffd62e,#e99d00);color:#111;border:0}.mode b{display:block;color:#ffd62e;font-size:20px;margin-bottom:7px}.mode:first-child b,.mode:first-child span{color:#111}.mode span{color:#aaa;font-size:14px}.mode:hover{border-color:#ffd62e;transform:translateY(-4px)}.modeIcon{display:block;font-size:28px;margin-bottom:10px}.menuBtn{margin-top:10px;background:#292929;color:white}@media(max-width:620px){.home{min-height:100vh;border-radius:0}.homeContent{padding-top:265px}.homeContent h1{font-size:36px}.modes{grid-template-columns:1fr}.mode{min-height:116px}}
.penalties{min-height:100vh;background:radial-gradient(circle at 50% 20%,#205337,#07130d 65%);padding:18px}.penHead{display:flex;justify-content:space-between}.goalScene{position:relative;height:390px;max-width:680px;margin:18px auto;background:linear-gradient(#142b3e 0 52%,#197341 52%);border-radius:24px;overflow:hidden}.goal{position:absolute;left:12%;right:12%;top:80px;height:190px;border:8px solid white;background:repeating-linear-gradient(90deg,transparent 0 42px,#ffffff38 43px 45px),repeating-linear-gradient(0deg,transparent 0 35px,#ffffff38 36px 38px)}.keeper{position:absolute;left:50%;top:185px;transform:translateX(-50%);font-size:70px;transition:.55s;z-index:4}.keeper.left{left:24%;transform:translateX(-50%) rotate(-35deg)}.keeper.right{left:76%;transform:translateX(-50%) rotate(35deg)}.ballPen{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);font-size:40px;z-index:5;transition:.6s}.ballPen.shoot-left{left:25%;bottom:210px;transform:translateX(-50%) scale(.55)}.ballPen.shoot-center{bottom:210px;transform:translateX(-50%) scale(.55)}.ballPen.shoot-right{left:75%;bottom:210px;transform:translateX(-50%) scale(.55)}.shooter{position:absolute;left:35%;bottom:15px;font-size:64px}.penControls{max-width:680px;margin:auto}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dir{padding:14px 4px;border:2px solid #555;border-radius:13px;background:#171717;color:#fff;font-weight:900}.dir.selected{border-color:#ffd62e;background:#493d0d}.power{margin:15px 0}.power input{width:100%;accent-color:#ffd62e}.penResult{text-align:center;min-height:38px;font-size:24px;font-weight:1000;color:#ffd62e;margin:10px}.dots{display:flex;gap:6px}.dot{width:17px;height:17px;border-radius:50%;background:#555}.goalDot{background:#3bd47f}.missDot{background:#ef4b4b}
</style>
</head>
<body><div class="app">
<section id="home" class="home"><div class="heroBrand"><div class="logo">DT</div><span class="edition">FÚTBOL FEMENINO</span></div><div class="homeContent"><div class="tag">EL PARTIDO EMPIEZA EN TU CABEZA</div><h1>Leé el juego.<br>Dejá tu marca.</h1><p>Tomá decisiones, dominá cada fase y construí tu identidad como entrenadora.</p><div class="modes"><button class="mode" onclick="start('desafio')"><span class="modeIcon">⚽</span><b>DT DESAFÍO</b><span>Leé la jugada. Elegí. Ganá.</span></button><button class="mode" onclick="startPenalties()"><span class="modeIcon">🥅</span><b>PENALES</b><span>Elegí dirección y potencia. Superá a la arquera.</span></button></div><p>RÉCORD PERSONAL · <b id="best">0</b> PTS</p></div></section>
<section id="game" class="hide"><div class="top"><b class="brand">DT</b><span id="progress"></span></div><div class="stats"><span id="match"></span><span class="streak" id="streak"></span><b id="points">0 PTS</b></div><div class="card"><span class="phase" id="phase"></span><h2 id="title"></h2><div class="pitch" id="pitch"></div><p class="question" id="prompt"></p><div class="answers" id="answers"></div><div id="feedback" class="feedback hide"></div><button id="next" class="btn hide" onclick="next()">SIGUIENTE DESAFÍO</button></div></section>
<section id="result" class="result hide"><div class="logo">DT</div><h1>PARTIDO TERMINADO</h1><p>Tu puntaje táctico</p><div class="score" id="final"></div><p id="message"></p><button class="btn" onclick="start(mode)">REVANCHA</button><button class="btn menuBtn" onclick="menu()">ELEGIR OTRO JUEGO</button></section>
</div><section id="penalties" class="penalties hide"><div class="penHead"><b class="brand">DT · PENALES</b><div class="dots" id="penDots"></div><b><span id="penGoals">0</span>/5</b></div><div class="goalScene"><div class="goal"></div><div id="keeper" class="keeper">🧤</div><div class="shooter">🏃‍♀️</div><div id="penBall" class="ballPen">⚽</div></div><div class="penControls"><div id="penResult" class="penResult">ELEGÍ DÓNDE REMATAR</div><div class="directions"><button class="dir" onclick="chooseDir('left',this)">↖ IZQUIERDA</button><button class="dir" onclick="chooseDir('center',this)">↑ CENTRO</button><button class="dir" onclick="chooseDir('right',this)">DERECHA ↗</button></div><div class="power"><label>POTENCIA · <b id="powerValue">70</b>%</label><input id="power" type="range" min="35" max="100" value="70" oninput="$('powerValue').textContent=this.value"></div><button id="shootBtn" class="btn" onclick="shootPenalty()">REMATAR</button><button class="btn menuBtn" onclick="penMenu()">VOLVER AL MENÚ</button></div></section><div id="celebrate" class="celebrate hide"></div><script>
const Q=[
{p:"ATAQUE",t:"Superioridad por banda",m:"18' · 0—0",q:"Recibís abierta y la lateral rival salta a presionarte. ¿Cuál es la mejor decisión?",a:["Conducir hacia la línea","Jugar dentro y atacar profundidad","Enviar un centro inmediato"],c:1,e:"Jugar dentro fija a la defensora y habilita la ruptura por fuera. La descarga mantiene la ventaja.",x:[[18,22,"us",3],[42,26,"us",8],[66,18,"us ball",7],[80,24,"them",2],[58,48,"them",5]]},
{p:"DEFENSA",t:"Defender un 3 vs 2",m:"31' · 1—0",q:"Sos la defensora más cercana a la poseedora. ¿Qué prioridad tenés?",a:["Ir directo al quite","Temporizar y orientar hacia afuera","Retroceder hasta el área"],c:1,e:"En inferioridad, temporizar permite reorganizarse. Orientar hacia afuera protege el carril central.",x:[[25,50,"them ball",9],[54,28,"them",11],[56,72,"them",7],[45,48,"us",2],[68,52,"us",6]]},
{p:"TRANSICIÓN",t:"Recuperación en campo rival",m:"44' · 1—1",q:"Recuperás con el rival abierto y desorganizado. ¿Qué buscás primero?",a:["Pase atrás para asegurar","Progresión vertical a la jugadora libre","Conducción lateral"],c:1,e:"La recuperación crea una ventaja temporal. Progresar antes de la reorganización rival aumenta la posibilidad de finalizar.",x:[[55,50,"us ball",5],[74,32,"us",10],[81,68,"us",9],[47,28,"them",8],[67,52,"them",4]]},
{p:"ATAQUE",t:"Fijar para liberar",m:"57' · 1—1",q:"La central conduce y atrae a una rival. ¿Qué movimiento necesita la volante?",a:["Acercarse a la poseedora","Quedarse fija","Moverse a espalda de la rival"],c:2,e:"Moverse a espalda de la jugadora fijada genera una línea de pase que supera la presión.",x:[[30,50,"us ball",4],[52,50,"them",9],[52,28,"us",5],[72,24,"us",11],[68,62,"them",6]]},
{p:"TRANSICIÓN",t:"Pérdida tras ataque",m:"79' · 1—1",q:"Perdés la pelota con muchas jugadoras por delante. ¿Qué acción inmediata conviene?",a:["Repliegue de todas sin presión","Presión inmediata de cercanas y cobertura","Falta táctica automática"],c:1,e:"Las cercanas presionan para impedir el primer pase y las demás protegen la profundidad.",x:[[70,48,"them ball",6],[74,28,"us",10],[76,66,"us",7],[58,50,"us",5],[45,50,"them",9]]}
];let i=0,score=0,streak=0,done=false,mode="desafio";
const $=id=>document.getElementById(id);$("best").textContent=localStorage.getItem("dtbest")||0;
function start(m="desafio"){mode=m;i=0;score=0;streak=0;$("home").classList.add("hide");$("result").classList.add("hide");$("game").classList.remove("hide");render()}function menu(){$("game").classList.add("hide");$("result").classList.add("hide");$("home").classList.remove("hide")}
function render(){done=false;let o=Q[i];$("progress").textContent=`DESAFÍO ${i+1}/${Q.length}`;$("points").textContent=score+" PTS";$("streak").textContent=streak>1?"🔥 RACHA x"+streak:"";$("match").textContent=o.m;$("phase").textContent=o.p;$("title").textContent=o.t;$("prompt").textContent=o.q;$("feedback").classList.add("hide");$("next").classList.add("hide");$("pitch").classList.remove("success");$("pitch").innerHTML=o.x.map(v=>`<div class="p ${v[2]}" style="left:${v[0]}%;top:${v[1]}%">${v[3]}</div>`).join("");$("answers").innerHTML=o.a.map((a,n)=>`<button class="answer" onclick="answer(${n},this)"><b>${String.fromCharCode(65+n)}.</b> ${a}</button>`).join("")}
function answer(n,b){if(done)return;done=true;let o=Q[i],buttons=[...document.querySelectorAll(".answer")];buttons[o.c].classList.add("good");if(n!==o.c){b.classList.add("bad");streak=0}else{let gain=(mode==="reloj"?150:100)+streak*20;score+=gain;streak++;let fx=$("celebrate");fx.innerHTML='<div class="hit"><strong>¡GRAN DECISIÓN!</strong><span>+'+gain+' PUNTOS · RACHA x'+streak+'</span></div>'+Array.from({length:32},(_,k)=>'<i class="confetti" style="--x:'+(Math.random()*100)+'%;--c:'+(k%3?"#ffd62e":"#3bd47f")+';animation-delay:'+(Math.random()*.25)+'s"></i>').join("");fx.classList.remove("hide");$("pitch").classList.add("success");document.querySelectorAll(".p").forEach(p=>p.classList.add("success"));setTimeout(()=>fx.classList.add("hide"),2200)}$("points").textContent=score+" PTS";$("streak").textContent=streak>1?"🔥 RACHA x"+streak:"";$("feedback").innerHTML="<b>"+(n===o.c?"✅ ¡Excelente lectura! + PUNTOS":"❌ Revisemos la jugada")+"</b><br>"+o.e;$("feedback").classList.remove("hide");$("next").classList.remove("hide")}
function next(){if(++i<Q.length)return render();let best=Math.max(score,Number(localStorage.getItem("dtbest")||0));localStorage.setItem("dtbest",best);$("game").classList.add("hide");$("result").classList.remove("hide");$("final").textContent=score;$("message").textContent=score>=500?"Excelente lectura táctica.":score>=300?"Buen partido. Seguimos entrenando decisiones.":"Cada partido mejora tu lectura del juego."}
let penDir=null,penShot=0,penGoals=0,penBusy=false;function startPenalties(){$("home").classList.add("hide");$("penalties").classList.remove("hide");penShot=0;penGoals=0;$("penGoals").textContent="0";$("penDots").innerHTML="";$("penResult").textContent="ELEGÍ DÓNDE REMATAR";$("shootBtn").textContent="REMATAR";$("shootBtn").onclick=shootPenalty;resetPenalty()}function chooseDir(d,b){if(penBusy)return;penDir=d;document.querySelectorAll(".dir").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}function resetPenalty(){$("keeper").className="keeper";$("penBall").className="ballPen";$("shootBtn").disabled=false;document.querySelectorAll(".dir").forEach(x=>x.classList.remove("selected"));penDir=null;penBusy=false}function shootPenalty(){if(penBusy||!penDir){$("penResult").textContent="PRIMERO ELEGÍ UNA DIRECCIÓN";return}penBusy=true;$("shootBtn").disabled=true;let kd=["left","center","right"][Math.floor(Math.random()*3)],power=Number($("power").value);$("keeper").className="keeper "+kd;$("penBall").className="ballPen shoot-"+penDir;let accurate=Math.random()<Math.max(.55,1-Math.abs(power-78)/75),goal=accurate&&kd!==penDir;setTimeout(()=>{penShot++;if(goal)penGoals++;$("penGoals").textContent=penGoals;$("penResult").textContent=goal?"⚽ ¡GOOOL!":accurate?"🧤 ¡ATAJÓ LA ARQUERA!":"REMATE AFUERA";$("penDots").innerHTML+=`<i class="dot ${goal?"goalDot":"missDot"}"></i>`;if(penShot>=5){setTimeout(()=>{$("penResult").textContent=`SERIE FINALIZADA · ${penGoals} GOLES`;$("shootBtn").textContent="JUGAR OTRA SERIE";$("shootBtn").disabled=false;$("shootBtn").onclick=startPenalties},700)}else setTimeout(resetPenalty,1200)},650)}function penMenu(){$("penalties").classList.add("hide");$("home").classList.remove("hide")}
</script></body></html>
