<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cordobeses Juegan · Plataforma de competencia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body,#root{margin:0;min-width:320px;min-height:100%;font-family:'Baloo 2','Nunito',Arial,sans-serif;background:#f3f5f9}button,input,select,textarea{font:inherit}</style><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script><script src="fixture-logic-deportes.js?v=2"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--noche:#0B192C;--noche-2:#13294A;--noche-3:#1C3A63;--oro:#D4A73C;--oro-claro:#F3E3B5;--fondo:#F4F6FA;--superficie:#fff;--borde:#E3E8EF;--borde-fuerte:#C9D2DE;--texto:#0F1B2D;--texto-2:#5B6779;--texto-3:#8A94A6;--primario:#1F5FAF;--exito:#16804A;--exito-claro:#E6F4EC;--critico:#C2412D;--critico-claro:#FBEDEA;--aviso:#B7791F;--aviso-claro:#FDF4E3;--deporte:#1F5FAF;--f-titulo:"Plus Jakarta Sans",Inter,system-ui,sans-serif;--f-texto:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
html,body,#root{background:var(--fondo)!important;font-family:var(--f-texto)!important;color:var(--texto);-webkit-font-smoothing:antialiased}
.cj-app{min-height:100vh;font-family:var(--f-texto);background:var(--fondo)}
.cj-app input,.cj-app select,.cj-app textarea,.cj-app button{font-family:var(--f-texto)}
.cj-app button:focus-visible,.cj-app a:focus-visible,.cj-app [role=button]:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.cj-contenido{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
/* Header institucional */
.cj-header{background:linear-gradient(135deg,var(--noche) 0%,var(--noche-2) 60%,var(--noche-3) 100%);color:#fff;position:relative}
.cj-header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--oro),#F2D27C,var(--oro))}
.cj-header-in{max-width:1180px;margin:0 auto;padding:14px 16px 4px}
.cj-header-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cj-logos{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:7px 12px}
.cj-logos img{display:block;height:32px;width:auto}
.cj-tit{flex:1;min-width:190px}
.cj-tit .k{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--oro)}
.cj-tit h1{font:800 clamp(22px,4.4vw,30px)/1.1 var(--f-titulo);margin:2px 0 0;letter-spacing:-.01em}
.cj-modo{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:4px}
.cj-modo button{border:0;background:transparent;color:#C8D5E8;font:600 14px var(--f-texto);padding:9px 12px;border-radius:9px;cursor:pointer;min-height:40px}
.cj-modo button[aria-pressed=true]{background:#fff;color:var(--noche)}
.cj-disciplinas{display:flex;gap:8px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
.cj-disciplinas::-webkit-scrollbar{display:none}
.cj-disc{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:700 15px var(--f-titulo);cursor:pointer;min-height:46px;text-decoration:none}
.cj-disc .p{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cj-disc[aria-current=true]{background:#fff;color:var(--noche);border-color:#fff;box-shadow:inset 0 -3px 0 var(--c)}
.cj-disc.inicio{background:transparent}
/* Barra de filtros */
.cj-filtros{background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(15,27,45,.05)}
.cj-filtros-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cj-segmento{display:flex;background:#EEF2F7;border-radius:12px;padding:4px}
.cj-segmento button{border:0;background:transparent;font:600 15px var(--f-texto);color:var(--texto-2);padding:8px 16px;border-radius:9px;cursor:pointer;min-height:40px}
.cj-segmento button[aria-pressed=true]{background:#fff;color:var(--texto);box-shadow:0 1px 3px rgba(15,27,45,.14)}
.cj-buscar{flex:1;min-width:200px;position:relative;display:block}
.cj-buscar input{width:100%;min-height:44px;border:1px solid var(--borde-fuerte);border-radius:12px;padding:0 14px 0 40px;font:500 15px var(--f-texto);background:#fff;color:var(--texto)}
.cj-buscar input:focus{outline:3px solid #CFE0F5;border-color:var(--primario)}
.cj-buscar:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-54%);font-size:20px;color:var(--texto-3)}
/* Indicadores */
.cj-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:720px){.cj-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cj-kpi{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px 16px}
.cj-kpi .k{font-size:12px;font-weight:600;color:var(--texto-2);text-transform:uppercase;letter-spacing:.06em}
.cj-kpi .v{font:800 28px/1.15 var(--f-titulo);margin-top:2px;font-variant-numeric:tabular-nums}
.cj-kpi .v small{font-size:15px;color:var(--texto-3);font-weight:700}
.cj-kpi .barra{height:6px;border-radius:3px;background:#EEF2F7;margin-top:8px;overflow:hidden}
.cj-kpi .barra i{display:block;height:100%;background:var(--exito)}
/* Tarjeta de acceso */
.cj-acceso{background:#fff;border:1px solid var(--borde);border-left:5px solid var(--oro);border-radius:14px;padding:14px 16px;margin-bottom:14px}
/* Chips */
.cj-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:#EEF2F7;color:var(--texto-2);white-space:nowrap}
.cj-chip.dot:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.cj-chip-vivo{background:var(--exito-claro);color:var(--exito)}
.cj-chip-pend{background:var(--aviso-claro);color:var(--aviso)}
.cj-chip-fin{background:#E8EDF4;color:var(--noche-2)}
.cj-chip-baja{background:var(--critico-claro);color:var(--critico)}
.cj-chip-inst{background:#EAF0F8;color:var(--noche-2)}
.cj-chip-reg{background:#F7EDD2;color:#7A5A12}
/* Tarjeta de fecha (acordeón) */
.cj-jornada{background:#fff;border:1px solid var(--borde);border-radius:14px;box-shadow:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.05);margin-bottom:12px;overflow:hidden;transition:box-shadow .15s}
.cj-jornada:hover{box-shadow:0 1px 2px rgba(15,27,45,.06),0 10px 26px rgba(15,27,45,.09)}
.cj-j-cab{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.cj-jornada.abierta .cj-j-cab{border-bottom:1px solid var(--borde);background:#FAFBFD}
.cj-j-izq{display:flex;gap:14px;align-items:center;min-width:0}
.cj-fecha{flex:0 0 58px;text-align:center;border-radius:12px;background:var(--noche);color:#fff;padding:7px 0;box-shadow:inset 0 -3px 0 var(--deporte)}
.cj-fecha b{display:block;font:800 22px/1 var(--f-titulo)}
.cj-fecha span{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--oro-claro)}
.cj-j-info{min-width:0}
.cj-j-info h3{font:800 17px/1.2 var(--f-titulo);margin:0;color:var(--texto)}
.cj-j-info .meta{color:var(--texto-2);font-size:14px;margin-top:2px}
.cj-j-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cj-j-acc{display:flex;gap:8px;align-items:center}
.cj-j-acc button{min-height:38px;border-radius:10px!important;font-size:13px!important}
.cj-flecha{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#EEF2F7;color:var(--texto-2);font-size:18px;transition:transform .2s}
.cj-jornada.abierta .cj-flecha{transform:rotate(180deg)}
@media(max-width:600px){.cj-j-cab{grid-template-columns:minmax(0,1fr) auto;padding:12px 14px}.cj-flecha{display:none}.cj-fecha{flex-basis:52px}}
/* Botones del sistema */
.cj-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 15px/1 var(--f-texto);cursor:pointer;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.cj-btn-primario{background:var(--primario);color:#fff}
.cj-btn-exito{background:var(--exito);color:#fff}
.cj-btn-secundario{background:#fff;color:var(--texto);border-color:var(--borde-fuerte)}
.cj-btn-critico{background:#fff;color:var(--critico);border-color:#EBC3BB}
#abrir-vista-profes{background:var(--noche)!important;border:1px solid var(--oro)!important}
.cj-j-acc button{background:#fff!important;color:var(--texto)!important;border:1px solid var(--borde-fuerte)!important;font-weight:600!important;padding:0 12px!important}
@media(max-width:600px){.cj-j-cab{grid-template-columns:minmax(0,1fr)}.cj-j-acc{padding-left:66px}}
/* ===== Fase 3: módulo de cruces, zonas, marcadores y tabla ===== */
.cj-btn-chico{min-height:36px;padding:0 12px;font-size:14px}
.cj-btn-grande{min-height:52px;padding:0 22px;font-size:16px}
.cj-btn:disabled{opacity:.5;cursor:not-allowed}
.cj-seccion-fixture{margin-top:12px;border-top:1px solid var(--borde);padding-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.cj-sec-tit{font:800 18px var(--f-titulo);color:var(--texto);flex:1 1 220px}
.cj-ayuda{flex-basis:100%;font-size:14px;color:var(--texto-2);background:#F7F9FC;border-radius:10px;padding:10px 12px}
.cj-menu{position:relative}
.cj-menu>summary{list-style:none}
.cj-menu>summary::-webkit-details-marker{display:none}
.cj-menu-lista{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:#fff;border:1px solid var(--borde);border-radius:12px;box-shadow:0 12px 32px rgba(15,27,45,.16);padding:6px;z-index:60}
.cj-menu-lista button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:12px;border-radius:8px;font:500 15px var(--f-texto);cursor:pointer;color:var(--texto)}
.cj-menu-lista button:hover{background:#F2F5F9}
@media(max-width:600px){.cj-menu-lista{right:auto;left:0}}
/* botones que agregan los scripts (PDF, ganadores, deshacer) con el estilo secundario */
.boton-descargar-pdf,.boton-ver-ganadores,.boton-deshacer-fixture{margin:0!important;min-height:44px!important;padding:0 16px!important;border-radius:10px!important;border:1px solid var(--borde-fuerte)!important;background:#fff!important;color:var(--texto)!important;font:600 15px var(--f-texto)!important;box-shadow:none!important}
.boton-ver-ganadores:not(:disabled){border-color:#A9D6BC!important;color:var(--exito)!important}
.cj-cruces{background:#F7F9FC;border:1px solid var(--borde);border-radius:14px;padding:14px;margin-top:4px;min-width:0}
.cj-cruces input[type=number]:not(.cj-lado input),.cj-cruces select{min-height:40px;font-size:15px!important;border-radius:8px!important;border:1px solid var(--borde-fuerte)!important;padding:4px 8px!important}
.cj-cruces label{font-size:14px!important;color:var(--texto-2)!important}
.cj-zonas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px;margin-top:12px}
.cj-zona{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:0 0 6px;overflow:hidden;min-width:0;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.cj-zona-tit{font:800 16px var(--f-titulo);color:var(--texto);background:#F2F5F9;border-bottom:1px solid var(--borde);padding:12px 14px;margin-bottom:6px;letter-spacing:.02em}
.cj-zona-eq{display:flex;align-items:center;gap:8px;font-size:15px;padding:5px 14px}
.cj-zona-eq select,.cj-zona-eq button{min-height:34px!important;font-size:13px!important;border-radius:8px!important}
.cj-zona>select{margin:6px 14px 0!important;width:calc(100% - 28px)!important;min-height:40px;font-size:14px!important;border-radius:10px!important}
.cj-bloque{border-top:1px solid var(--borde);margin-top:10px;padding-top:8px}
.cj-bloque-tit{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3);padding:0 14px 4px}
.cj-partido{padding:8px 14px 10px;border-bottom:1px solid var(--borde)}
.cj-partido:last-child{border-bottom:0}
.cj-lado{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;align-items:center;padding:3px 0}
.cj-lado .eq{font-weight:600;font-size:15px;line-height:1.25;color:var(--texto);overflow-wrap:anywhere}
.cj-lado.ganador .eq{color:var(--exito);font-weight:800}
.cj-lado input{width:60px;height:46px;text-align:center;font:800 22px var(--f-titulo);border:1.5px solid var(--borde-fuerte);border-radius:10px;background:#fff;color:var(--texto);padding:0;-moz-appearance:textfield;opacity:1}
.cj-lado input::-webkit-outer-spin-button,.cj-lado input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cj-lado input:focus{outline:3px solid #CFE0F5;border-color:var(--primario)}
.cj-lado input:disabled,.cj-lado input[readonly]{background:#F7F9FC;border-color:transparent;color:var(--texto);-webkit-text-fill-color:var(--texto)}
.cj-lado.ganador input{color:var(--exito);-webkit-text-fill-color:var(--exito)}
.cj-pie{font-size:13px;color:var(--texto-3);margin-top:4px}
.cj-pie b{color:var(--aviso);font-weight:600}
.cj-tabla{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed;font-variant-numeric:tabular-nums}
.cj-tabla th{font-size:11px;font-weight:700;color:var(--texto-3);text-transform:uppercase;padding:8px 2px;text-align:center;width:34px}
.cj-tabla th.eq{width:auto;text-align:left;padding-left:14px}
.cj-tabla th:last-child:empty{width:40px}
.cj-tabla td{padding:9px 2px;text-align:center;border-top:1px solid var(--borde)}
.cj-tabla td.eq{text-align:left;padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cj-tabla td.pts{font-weight:800}
.cj-tabla tr.clasifica td{background:var(--exito-claro)}
.cj-tabla tr.clasifica td.eq{box-shadow:inset 4px 0 0 var(--exito);font-weight:700}
.cj-tabla tr.manual td{background:#F2E9F7}
.cj-tabla td button{min-height:30px;border-radius:6px!important}
@media(max-width:480px){.cj-tabla .opt{display:none}.cj-tabla th{width:30px}.cj-tabla{font-size:14px}}
.fase-final-automatica{border-radius:14px!important;background:#fff!important;border:1px solid var(--borde)!important;padding:14px!important;flex-basis:100%;min-width:0}
.fase-final-automatica>div:first-child{font:800 15px var(--f-titulo)!important;color:var(--texto)!important;letter-spacing:.02em}
.fase-final-automatica input{width:52px!important;height:42px;font:800 20px var(--f-titulo)!important;border-radius:9px!important}
.fase-final-automatica div{font-size:14px}
.cj-seccion-fixture>div:last-child{min-width:0}
.cj-cruces .cj-btn{white-space:normal;text-align:center;line-height:1.2;max-width:100%}
.cj-cruces>div{max-width:100%}
@media(max-width:480px){.cj-cruces{padding:10px}.cj-cruces .cj-btn{width:100%}.cj-tabla th{width:28px}}
/* Lista de equipos: columnas de 8 una al lado de la otra */
.cj-eq-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 8px;font:800 16px var(--f-titulo);color:var(--texto)}
.cj-lista-equipos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:6px 14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.cj-lista-equipos>*{scroll-snap-align:start}
@media(max-width:600px){.cj-lista-equipos{grid-auto-columns:86%}}
.cj-eq-fila{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#F7F9FC;border:1px solid var(--borde);min-width:0}
.cj-eq-fila .n{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--borde);font-size:12px;font-weight:700;color:var(--texto-2)}
.cj-eq-fila .nombre{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--texto);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cj-eq-fila.baja{background:var(--critico-claro);border-color:#F1CFC8}
.cj-eq-fila.baja .nombre{color:var(--critico);text-decoration:line-through}
.cj-eq-fila button{min-height:34px;border-radius:8px!important;font-size:13px!important;padding:0 10px!important}
.cj-eq-fila .res input{max-width:120px}
.cj-eq-fila{flex-wrap:wrap;row-gap:6px}
.cj-eq-fila .nombre{flex:1 1 calc(100% - 40px);white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.cj-eq-fila>span:not(.n):not(.nombre){margin-left:36px}
.cj-eq-fila>button{margin-left:36px}
.cj-eq-fila .res{flex:1;min-width:0}
.cj-eq-fila .res input{width:100%;max-width:none;min-height:34px;border-radius:8px}
.cj-eq-fila .res{flex:1 1 120px}

  // Guarda lo leído de la planilla: al volver a entrar (o al cambiar de deporte) se muestra al instante
  // y, en paralelo, se vuelve a leer la planilla para que la próxima vez esté al día.
  function cargarDeporte(deporte) {
    var clave = "cj-datos-" + cfg.planillaId + "-" + cfg.anio + "-" + deporte.k;
    var guardado = null;
    try { guardado = JSON.parse(localStorage.getItem(clave) || "null"); } catch (e) { guardado = null; }
    var red = cargarDeporteRed(deporte).then(function (datos) {
      try { localStorage.setItem(clave, JSON.stringify({ t: Date.now(), datos: datos })); } catch (e) {}
      return datos;
    });
    if (guardado && guardado.datos && Date.now() - guardado.t < 15 * 60 * 1000) { red.catch(function () {}); return Promise.resolve(guardado.datos); }
    return red.catch(function (e) { if (guardado && guardado.datos) return guardado.datos; throw e; });
  }
  function cargarDeporteRed(deporte) {
    return Promise.all(deporte.hojas.map(function (h) { return leerHoja(deporte, h); })).then(function (listas) {
      var datos = { femenino: [], masculino: [] }, usados = {};
      [].concat.apply([], listas).forEach(function (b) {
        var esFem = b.ramaTxt.indexOf("FEM") !== -1, esMasc = b.ramaTxt.indexOf("MASC") !== -1;
        var rama = esFem || !esMasc ? "femenino" : "masculino";
        var mixta = esFem && esMasc;
        var grupo = b.regiones.join(" / ") || null;
        var base = [deporte.k, cfg.anio, b.fecha.replace(/[^0-9a-z]/gi, ""), slug(b.categoria), rama.charAt(0), slug(grupo || b.instancia)].join("-");
        usados[base] = (usados[base] || 0) + 1;
        var id = usados[base] > 1 ? base + "-" + usados[base] : base;
        var jornada = { id: id, fecha: b.fecha, categoria: b.categoria || "-", instancia: b.instancia || "-", grupo: grupo, sede: b.sede || "A confirmar",
          horario: b.horario || "", ganadores: b.ganadores >= 1 && b.ganadores <= 4 ? b.ganadores : 1, equipos: b.equipos, pendiente: b.equipos.length === 0, rama: rama };
        datos[rama].push(jornada);
        if (mixta) datos.masculino.push(jornada); // jornada mixta: aparece en las dos ramas
      });
      var orden = function (a, b) {
        var A = a.fecha.split("-"), B = b.fecha.split("-");
        return (parseInt(A[1]) || 99) - (parseInt(B[1]) || 99) || (parseInt(A[0]) || 99) - (parseInt(B[0]) || 99);
      };
      datos.femenino.sort(orden); datos.masculino.sort(orden);
      return datos;
    });
  }

        'radial-gradient(ellipse 90% 40% at 50% 30%,rgba(40,90,170,.35),transparent 70%),linear-gradient(180deg,#040A18 0%,#0A1A3A 55%,#0B2A2A 78%,#0E4A2A 100%)}' +

      '</style>';
    var tarjetas = cfg.deportes.map(function (d) {
      return '<a class="dep" style="--c:' + d.color + ';--c2:' + d.color2 + '" href="' + esc(urlDeporte(d)) + '" data-k="' + d.k + '">' +

        var proxima = fechas.filter(function (f) { return f.slice(3) + f.slice(0, 2) >= hoyTxt; })[0];

  var k = params.get("deporte");
