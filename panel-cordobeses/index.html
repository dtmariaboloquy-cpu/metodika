function ResultadoInput({ value, onChange }) {
  return (
    <input
      value={value || ""}
      onChange={(e) => onChange(e.target.value)}
      placeholder="Resultado / posición"
      style={{ fontSize: 11, padding: "4px 8px", borderRadius: 5, border: `1px solid ${C.border}`, color: C.ink, width: 150 }}
    />
  );
}

function parseCanchas(sede) {
  const m = (sede || "").match(/(\d+)\s*cancha/i);
  return m ? parseInt(m[1]) : 1;
}

function partidosDeZona(equipos, zonaIdx, numZonas, numCanchas) {
  const canchasPorZona = Math.max(1, Math.floor(numCanchas / numZonas));
  const partidos = [];
  for (let i = 0; i < equipos.length; i++) {
    for (let j = i + 1; j < equipos.length; j++) {
      const k = partidos.length;
      const cancha = ((zonaIdx * canchasPorZona + k) % numCanchas) + 1;
      partidos.push({ local: equipos[i], visitante: equipos[j], cancha, key: zonaIdx + "|" + equipos[i] + "|" + equipos[j] });
    }
  }
  return partidos;
}

function tablaPosiciones(equipos, partidos, resultados) {
  const tabla = {};
  equipos.forEach((eq) => (tabla[eq] = { equipo: eq, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0 }));
  partidos.forEach((partido) => {
    const r = resultados[partido.key];
    if (!r || r.gl === "" || r.gv === "" || r.gl == null || r.gv == null) return;
    const gl = parseInt(r.gl), gv = parseInt(r.gv);
    if (isNaN(gl) || isNaN(gv)) return;
    const L = tabla[partido.local], V = tabla[partido.visitante];
    L.pj++; V.pj++;
    L.gf += gl; L.gc += gv;
    V.gf += gv; V.gc += gl;
    if (gl > gv) { L.g++; V.p++; }
    else if (gl < gv) { V.g++; L.p++; }
    else { L.e++; V.e++; }
  });
  return Object.values(tabla)
    .map((t) => ({ ...t, dg: t.gf - t.gc, pts: t.g * 3 + t.e }))
    .sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf);
}

function CrucesPanel({ jornada, equiposActivos, config, setConfig, sorteo, setSorteo, resultados, setResultado, C }) {
  const numZonas = config?.numZonas || 1;
  const numCanchas = config?.numCanchas || parseCanchas(jornada.sede);

  const bolsa = sorteo?.bolsa || null;
  const orden = sorteo?.orden || [];
  const asignacion = {};
  orden.forEach((eq, i) => (asignacion[eq] = i % numZonas));

  const iniciarSorteo = () => {
    const mezclado = [...equiposActivos];
    for (let i = mezclado.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [mezclado[i], mezclado[j]] = [mezclado[j], mezclado[i]];
    }
    setSorteo({ bolsa: mezclado, orden: [] });
  };

  const distribuirAutomatico = () => {
    const mezclado = [...equiposActivos];
    for (let i = mezclado.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [mezclado[i], mezclado[j]] = [mezclado[j], mezclado[i]];
    }
    setSorteo({ bolsa: [], orden: mezclado });
  };

  const sacarEquipo = () => {
    if (!bolsa || bolsa.length === 0) return;
    const [saliente, ...resto] = bolsa;
    setSorteo({ bolsa: resto, orden: [...orden, saliente] });
  };

  const reiniciar = () => setSorteo({ bolsa: null, orden: [] });

  // si se agregó o bajó un equipo después de armar el sorteo, lo mandamos de nuevo a la bolsa
  const enSorteo = new Set([...(bolsa || []), ...orden]);
  const pendientesDeBolsa = equiposActivos.filter((e) => !enSorteo.has(e));

  const zonas = Array.from({ length: numZonas }, (_, zi) => orden.filter((_, i) => i % numZonas === zi));
  const ultimoSacado = orden[orden.length - 1];

  return (
    <div style={{ background: "#F7F8FA", borderRadius: 8, padding: 12, marginTop: 8 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", marginBottom: 10 }}>
        <label style={{ fontSize: 11, color: C.sub, display: "flex", alignItems: "center", gap: 6 }}>
          Zonas
          <input type="number" min="1" value={numZonas} onChange={(e) => setConfig({ ...config, numZonas: Math.max(1, parseInt(e.target.value) || 1) })} style={{ width: 46, fontSize: 12, padding: "3px 6px", borderRadius: 5, border: `1px solid ${C.border}` }} />
        </label>
        <label style={{ fontSize: 11, color: C.sub, display: "flex", alignItems: "center", gap: 6 }}>
          Canchas disponibles
          <input type="number" min="1" value={numCanchas} onChange={(e) => setConfig({ ...config, numCanchas: Math.max(1, parseInt(e.target.value) || 1) })} style={{ width: 46, fontSize: 12, padding: "3px 6px", borderRadius: 5, border: `1px solid ${C.border}` }} />
        </label>
        <span style={{ fontSize: 11, color: C.sub }}>{equiposActivos.length} equipos activos · van entrando a las zonas 1→{numZonas}→1… en el orden que salen</span>
      </div>

      {!bolsa ? (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={iniciarSorteo} disabled={equiposActivos.length === 0} style={{ fontSize: 12, padding: "8px 16px", borderRadius: 8, border: "none", background: C.primario, color: "#fff", fontWeight: 700, cursor: "pointer" }}>
            🎱 Sorteo en vivo, uno por uno
          </button>
          <button onClick={distribuirAutomatico} disabled={equiposActivos.length === 0} style={{ fontSize: 12, padding: "8px 16px", borderRadius: 8, border: `1px solid ${C.primario}`, background: "#fff", color: C.primario, fontWeight: 700, cursor: "pointer" }}>
            ⚡ Distribuir automáticamente, todo junto
          </button>
        </div>
      ) : bolsa.length === 0 && orden.length > 0 ? (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
            <Badge color="#fff" bg={C.verde}>✓ Distribución lista</Badge>
            {pendientesDeBolsa.length > 0 && (
              <span style={{ fontSize: 11, color: C.amarillo }}>+ {pendientesDeBolsa.length} equipo{pendientesDeBolsa.length > 1 ? "s" : ""} nuevo(s) sin asignar</span>
            )}
            <button onClick={reiniciar} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: `1px solid ${C.border}`, background: "#fff", color: C.sub, cursor: "pointer" }}>↺ Volver a armar</button>
          </div>
          {pendientesDeBolsa.length > 0 && (
            <button onClick={() => setSorteo({ bolsa: pendientesDeBolsa, orden })} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: "none", background: C.amarillo, color: "#fff", cursor: "pointer", marginBottom: 12 }}>
              Sortear los equipos nuevos
            </button>
          )}
        </div>
      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
            <button onClick={sacarEquipo} disabled={bolsa.length === 0} style={{ fontSize: 13, padding: "10px 20px", borderRadius: 8, border: "none", background: bolsa.length ? C.verde : "#C9CDD3", color: "#fff", fontWeight: 800, cursor: bolsa.length ? "pointer" : "default" }}>
              🎱 Sacar el próximo equipo
            </button>
            <span style={{ fontSize: 12, color: C.sub }}>Quedan {bolsa.length} en la bolsa</span>
            {pendientesDeBolsa.length > 0 && (
              <span style={{ fontSize: 11, color: C.amarillo }}>+ {pendientesDeBolsa.length} equipo{pendientesDeBolsa.length > 1 ? "s" : ""} nuevo(s) sin meter en la bolsa</span>
            )}
            <button onClick={reiniciar} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: `1px solid ${C.border}`, background: "#fff", color: C.sub, cursor: "pointer" }}>↺ Reiniciar sorteo</button>
          </div>

          {pendientesDeBolsa.length > 0 && (
            <button onClick={() => setSorteo({ bolsa: [...bolsa, ...pendientesDeBolsa], orden })} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: "none", background: C.amarillo, color: "#fff", cursor: "pointer", marginBottom: 12 }}>
              Meter los nuevos en la bolsa
            </button>
          )}

          {ultimoSacado && (
            <div style={{ background: C.primario, color: "#fff", borderRadius: 10, padding: "14px 18px", textAlign: "center", marginBottom: 14 }}>
              <div style={{ fontSize: 10, opacity: 0.8, letterSpacing: 1, marginBottom: 4 }}>SALIÓ</div>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{ultimoSacado}</div>
              <div style={{ fontSize: 11, opacity: 0.85, marginTop: 4 }}>→ Zona {((orden.length - 1) % numZonas) + 1}</div>
            </div>
          )}
        </>
      )}

      {orden.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(numZonas, 2)}, 1fr)`, gap: 10, marginTop: 4 }}>
          {zonas.map((equipos, zi) => {
            const partidos = partidosDeZona(equipos, zi, numZonas, numCanchas);
            const tabla = tablaPosiciones(equipos, partidos, resultados);
            return (
              <div key={zi} style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: C.primario, marginBottom: 6 }}>ZONA {zi + 1} ({equipos.length})</div>
                {equipos.map((eq, i) => (
                  <div key={eq} style={{ fontSize: 11, color: eq === ultimoSacado ? C.verde : C.ink, fontWeight: eq === ultimoSacado ? 700 : 400, marginBottom: 3 }}>
                    {i + 1}. {eq}
                  </div>
                ))}
                {equipos.length >= 2 && (
                  <>
                    <div style={{ marginTop: 8, borderTop: `1px solid ${C.border}`, paddingTop: 6 }}>
                      <div style={{ fontSize: 9, color: C.sub, fontWeight: 700, marginBottom: 4 }}>PARTIDOS Y RESULTADO</div>
                      {partidos.map((p) => {
                        const r = resultados[p.key] || {};
                        return (
                          <div key={p.key} style={{ fontSize: 10, color: C.ink, marginBottom: 5, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
                            <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.local} <span style={{ color: C.sub }}>vs</span> {p.visitante}</span>
                            <input type="number" min="0" value={r.gl ?? ""} onChange={(e) => setResultado(p.key, { ...r, gl: e.target.value })} style={{ width: 28, fontSize: 10, padding: "2px 3px", borderRadius: 4, border: `1px solid ${C.border}`, textAlign: "center" }} />
                            <span style={{ color: C.sub }}>-</span>
                            <input type="number" min="0" value={r.gv ?? ""} onChange={(e) => setResultado(p.key, { ...r, gv: e.target.value })} style={{ width: 28, fontSize: 10, padding: "2px 3px", borderRadius: 4, border: `1px solid ${C.border}`, textAlign: "center" }} />
                            <span style={{ color: C.primario, fontWeight: 700, fontSize: 9, whiteSpace: "nowrap" }}>C{p.cancha}</span>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ marginTop: 8, borderTop: `1px solid ${C.border}`, paddingTop: 6 }}>
                      <div style={{ fontSize: 9, color: C.sub, fontWeight: 700, marginBottom: 4 }}>TABLA DE POSICIONES</div>
                      <table style={{ width: "100%", fontSize: 9, color: C.ink, borderCollapse: "collapse" }}>
                        <thead>
                          <tr style={{ color: C.sub, textAlign: "center" }}>
                            <th style={{ textAlign: "left", fontWeight: 600 }}>Equipo</th>
                            <th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th>
                          </tr>
                        </thead>
                        <tbody>
                          {tabla.map((t, ti) => (
                            <tr key={t.equipo} style={{ textAlign: "center", background: ti < (jornada.ganadores || 1) ? "#EAF6EE" : "transparent" }}>
                              <td style={{ textAlign: "left", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 90, fontWeight: ti < (jornada.ganadores || 1) ? 700 : 400 }}>{t.equipo}</td>
                              <td>{t.pj}</td><td>{t.g}</td><td>{t.e}</td><td>{t.p}</td><td>{t.gf}</td><td>{t.gc}</td><td>{t.dg}</td><td style={{ fontWeight: 800 }}>{t.pts}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function EquipoRow({ equipo, estado, onToggleBajo, onResultado, ramaColor, editable }) {
  const bajo = estado?.bajo;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", borderRadius: 6, background: bajo ? "#FBEAEA" : "#FAFAFB", opacity: bajo ? 0.75 : 1 }}>
      <label style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", flex: 1, minWidth: 0 }}>
        <input type="checkbox" checked={!!bajo} disabled={!editable} onChange={(e) => onToggleBajo(e.target.checked)} />
        <span style={{ fontSize: 12, color: bajo ? C.rojo : C.ink, textDecoration: bajo ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {equipo}
        </span>
      </label>
      {bajo && <Badge color="#fff" bg={C.rojo}>BAJÓ</Badge>}
      <div style={{ pointerEvents: editable ? "auto" : "none", opacity: editable ? 1 : 0.8 }}><ResultadoInput value={estado?.resultado} onChange={onResultado} /></div>
    </div>
  );
}

function JornadaCard({ jornada, estados, setEstado, ramaColor, ramaLabel, extras, setExtras, cruces, setCruces, resultados, setResultado, responsables, setResponsables, editable }) {
  const [abierto, setAbierto] = useState(false);
  const [responsableAbierto, setResponsableAbierto] = useState(false);
  const [nuevoEquipo, setNuevoEquipo] = useState("");

  const equiposCompletos = [...jornada.equipos, ...(extras || [])];
  const nBajas = equiposCompletos.filter((_, i) => estados[jornada.id + "-" + i]?.bajo).length;
  const equiposActivos = equiposCompletos.filter((_, i) => !estados[jornada.id + "-" + i]?.bajo);

  const config = cruces?.config || { numZonas: 1, numCanchas: parseCanchas(jornada.sede) };
  const sorteo = cruces?.sorteo || { bolsa: null, orden: [] };

  const agregarEquipo = () => {
    if (!nuevoEquipo.trim()) return;
    setExtras([...(extras || []), nuevoEquipo.trim()]);
    setNuevoEquipo("");
  };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", marginBottom: 10 }}>
      <div onClick={() => !jornada.pendiente && setAbierto((v) => !v)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px", cursor: jornada.pendiente ? "default" : "pointer", flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <div style={{ background: ramaColor, color: "#fff", borderRadius: 8, padding: "6px 10px", textAlign: "center", minWidth: 52 }}>
            <div style={{ fontSize: 13, fontWeight: 800, lineHeight: 1 }}>{jornada.fecha.split("-")[0]}</div>
            <div style={{ fontSize: 9, fontWeight: 600, opacity: 0.85 }}>{["","ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"][parseInt(jornada.fecha.split("-")[1])]}</div>
          </div>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 3 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>{jornada.categoria}</span>
              <Badge color={C.primario} bg={C.primarioClaro}>{jornada.instancia}</Badge>
              {jornada.grupo && <Badge color={C.sub} bg="#EEF0F3">Grupo {jornada.grupo}</Badge>}
              {nBajas > 0 && <Badge color="#fff" bg={C.rojo}>{nBajas} baja{nBajas > 1 ? "s" : ""}</Badge>}
            </div>
            <div style={{ fontSize: 11, color: C.sub }}>{jornada.sede} · {jornada.horario}{jornada.ganadores ? ` · clasifican ${jornada.ganadores}` : ""}</div>
          </div>
        </div>
        <div style={{ fontSize: 11, color: C.sub, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <button
            onClick={(e) => { e.stopPropagation(); setResponsableAbierto((v) => !v); }}
            style={{ fontSize: 11, padding: "7px 11px", borderRadius: 7, border: `1px solid ${ramaColor}`, background: responsables?.nombre ? ramaColor : "#fff", color: responsables?.nombre ? "#fff" : ramaColor, fontWeight: 700, cursor: "pointer" }}
          >
            👤 {editable ? "Responsable de sede" : "Ver responsable"}
          </button>
          {!jornada.pendiente && <span>{equiposCompletos.length} equipos <span style={{ fontSize: 14 }}>{abierto ? "▲" : "▼"}</span></span>}
        </div>
      </div>

      {responsableAbierto && (
        <div style={{ margin: "0 14px 12px", padding: 12, background: C.primarioClaro, border: `1px solid ${C.border}`, borderRadius: 9 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: C.ink, marginBottom: 8 }}>Equipo responsable de esta jornada</div>
          <input
            value={responsables?.nombre || ""}
            onChange={(e) => setResponsables({ ...(responsables || {}), nombre: e.target.value })}
            disabled={!editable}
            placeholder="Nombre de la responsable de sede"
            style={{ width: "100%", fontSize: 12, padding: "8px 10px", borderRadius: 7, border: `1px solid ${C.border}`, marginBottom: 7, color: C.ink }}
          />
          <textarea
            value={responsables?.staff || ""}
            onChange={(e) => setResponsables({ ...(responsables || {}), staff: e.target.value })}
            disabled={!editable}
            placeholder={'Staff a cargo (escribí un nombre por línea)'}
            rows={4}
            style={{ width: "100%", fontSize: 12, padding: "8px 10px", borderRadius: 7, border: `1px solid ${C.border}`, resize: "vertical", color: C.ink }}
          />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginTop: 7, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, color: C.sub }}>Los datos quedan asociados únicamente a esta fecha.</span>
            <button onClick={() => setResponsableAbierto(false)} style={{ fontSize: 11, padding: "7px 14px", borderRadius: 7, border: "none", background: C.verde, color: "#fff", fontWeight: 700, cursor: "pointer" }}>{editable ? "Guardar" : "Cerrar"}</button>
          </div>
        </div>
      )}

      {jornada.pendiente && (
        <div style={{ padding: "0 14px 14px", fontSize: 12, color: C.sub, fontStyle: "italic" }}>
          A definir — se completa con las clasificadas de la fase zonal.
        </div>
      )}

      {abierto && !jornada.pendiente && (
        <div style={{ padding: "0 14px 14px", display: "flex", flexDirection: "column", gap: 4 }}>
          {equiposCompletos.map((eq, i) => {
            const key = jornada.id + "-" + i;
            return (
              <EquipoRow
                key={key}
                equipo={eq}
                estado={estados[key]}
                ramaColor={ramaColor}
                editable={editable}
                onToggleBajo={(v) => setEstado(key, { ...estados[key], bajo: v })}
                onResultado={(v) => setEstado(key, { ...estados[key], resultado: v })}
              />
            );
          })}

          {editable && <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
            <input
              value={nuevoEquipo}
              onChange={(e) => setNuevoEquipo(e.target.value)}
              placeholder="Agregar institución a esta jornada…"
              style={{ flex: 1, fontSize: 12, padding: "6px 10px", borderRadius: 6, border: `1px dashed ${C.border}`, color: C.ink }}
            />
            <button onClick={agregarEquipo} disabled={!nuevoEquipo.trim()} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: "none", background: C.verde, color: "#fff", fontWeight: 700, cursor: nuevoEquipo.trim() ? "pointer" : "not-allowed", opacity: nuevoEquipo.trim() ? 1 : 0.5 }}>＋ Agregar</button>
          </div>}

          <div style={{ marginTop: 10, borderTop: `1px solid ${C.border}`, paddingTop: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.ink, marginBottom: 4 }}>Armar cruces (sorteo) y resultados</div>
            <div style={{ fontSize: 11, color: C.sub, marginBottom: 6 }}>Armá las zonas, cargá el resultado de cada partido, y la tabla de posiciones (PJ, G, E, P, GF, GC, DG, Puntos) se calcula sola. Los puestos que clasifican quedan resaltados en verde.</div>
            <div style={{ pointerEvents: editable ? "auto" : "none", opacity: editable ? 1 : 0.88 }}><CrucesPanel
              jornada={jornada}
              equiposActivos={equiposActivos}
              config={config}
              setConfig={(c) => setCruces({ config: c, sorteo })}
              sorteo={sorteo}
              setSorteo={(s) => setCruces({ config, sorteo: s })}
              resultados={resultados || {}}
              setResultado={(key, val) => setResultado({ ...(resultados || {}), [key]: val })}
              C={C}
            /></div>
          </div>
        </div>
      )}
    </div>
  );
}

        <div>
          <div style={{ fontSize: 11, color: C.sub, fontWeight: 700, letterSpacing: 0.6 }}>ESQUEMA DE COMPETENCIA 2026</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: C.ink, fontFamily: "Georgia, serif" }}>Fútbol — Fixture y seguimiento de equipos</div>
        </div>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 800, color: C.ink }}>{esCoordinadora ? "Modo coordinadora" : Object.keys(permisos).length ? "Acceso autorizado" : "Modo consulta"}</div>
            <div style={{ fontSize: 10, color: C.sub }}>{esCoordinadora ? "Podés modificar todas las jornadas y aprobar responsables." : Object.keys(permisos).length ? "Solo podés modificar las fechas que te aprobaron." : "Podés ver toda la información sin modificarla."}</div>
          </div>
          {!esCoordinadora && <button onClick={() => setPedidoAbierto((v) => !v)} style={{ fontSize: 11, padding: "7px 12px", borderRadius: 7, border: "none", background: C.primario, color: "#fff", fontWeight: 700, cursor: "pointer" }}>Solicitar permiso de edición</button>}
        </div>
        {pedidoAbierto && (
          <div style={{ display: "grid", gridTemplateColumns: "minmax(150px,1fr) minmax(180px,2fr) auto", gap: 7, marginTop: 9 }}>
            <input value={nombrePedido} onChange={(e) => setNombrePedido(e.target.value)} placeholder="Tu nombre y apellido" style={{ padding: "8px 9px", borderRadius: 7, border: `1px solid ${C.border}`, fontSize: 12 }} />
            <select value={jornadaPedido} onChange={(e) => setJornadaPedido(e.target.value)} style={{ padding: "8px 9px", borderRadius: 7, border: `1px solid ${C.border}`, fontSize: 12 }}>
              <option value="">Elegí la jornada</option>
              {[...DATOS_CORDOBESES.femenino, ...DATOS_CORDOBESES.masculino].map((j) => <option key={j.id} value={j.id}>{j.fecha} · {j.categoria} · {j.grupo || j.instancia}</option>)}
            </select>
            <button onClick={solicitarAcceso} disabled={!nombrePedido.trim() || !jornadaPedido} style={{ padding: "8px 12px", borderRadius: 7, border: "none", background: C.verde, color: "#fff", fontWeight: 700, fontSize: 11 }}>Enviar solicitud</button>
          </div>
        )}
        {esCoordinadora && Object.entries(solicitudes).length > 0 && (
          <div style={{ marginTop: 10, borderTop: `1px solid ${C.border}`, paddingTop: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 800, marginBottom: 6 }}>Solicitudes pendientes</div>
            {Object.entries(solicitudes).map(([uid, s]) => <div key={uid} style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "center", padding: "6px 0", fontSize: 11 }}><span><strong>{s.nombre}</strong> · {s.jornadaId}</span><button onClick={() => aprobarSolicitud(uid, s.jornadaId)} style={{ border: "none", background: C.verde, color: "#fff", borderRadius: 6, padding: "5px 9px", fontWeight: 700 }}>Aprobar</button></div>)}
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", gap: 6 }}>
          {[{ k: "femenino", label: "Femenino" }, { k: "masculino", label: "Masculino" }].map((t) => (
            <button
              key={t.k}
              onClick={() => setRama(t.k)}
              style={{ fontSize: 13, padding: "8px 18px", borderRadius: 8, border: "none", background: rama === t.k ? (t.k === "masculino" ? C.doradoLogo : C.rojoLogo) : C.card, color: rama === t.k ? "#fff" : C.ink, fontWeight: 700, cursor: "pointer", boxShadow: rama === t.k ? "none" : `inset 0 0 0 1px ${C.border}` }}
            >
              {t.label}
            </button>
          ))}
        </div>
        <input
          value={busqueda}
          onChange={(e) => setBusqueda(e.target.value)}
          placeholder="Buscar institución o categoría…"
          style={{ fontSize: 12, padding: "8px 12px", borderRadius: 8, border: `1px solid ${C.border}`, color: C.ink, width: 220 }}
        />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, marginBottom: 18 }}>
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 14px" }}>
          <div style={{ fontSize: 10, color: C.sub, textTransform: "uppercase", fontWeight: 700 }}>Jornadas</div>
          <div style={{ fontSize: 20, fontWeight: 800, color: C.ink }}>{jornadas.length}</div>
        </div>
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 14px" }}>
          <div style={{ fontSize: 10, color: C.sub, textTransform: "uppercase", fontWeight: 700 }}>Instituciones anotadas</div>
          <div style={{ fontSize: 20, fontWeight: 800, color: C.ink }}>{totalEquipos}</div>
        </div>
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 14px" }}>
          <div style={{ fontSize: 10, color: C.sub, textTransform: "uppercase", fontWeight: 700 }}>Bajas cargadas</div>
          <div style={{ fontSize: 20, fontWeight: 800, color: totalBajas ? C.rojo : C.ink }}>{totalBajas}</div>
        </div>
      </div>

      {filtradas.length === 0 && <div style={{ fontSize: 13, color: C.sub, fontStyle: "italic" }}>No hay resultados para "{busqueda}".</div>}

      {filtradas.map((j) => (
        <JornadaCard
          key={j.id}
          jornada={j}
          estados={estados}
          setEstado={(key, v) => guardarJornada(j.id, `estados/${key}`, v)}
          ramaColor={ramaColor}
          ramaLabel={rama}
          extras={extras[j.id]}
          setExtras={(v) => guardarJornada(j.id, "extras", v)}
          cruces={cruces[j.id]}
          setCruces={(v) => guardarJornada(j.id, "cruces", v)}
          resultados={resultados[j.id]}
          setResultado={(v) => guardarJornada(j.id, "resultados", v)}
          responsables={responsables[j.id]}
          setResponsables={(v) => guardarJornada(j.id, "responsables", v)}
          editable={esCoordinadora || permisos[j.id] === true}
        />
      ))}

      <div style={{ fontSize: 11, color: C.sub, marginTop: 14, fontStyle: "italic" }}>
        Tocá una jornada para desplegar las instituciones. Los cambios (bajas y resultados) quedan guardados mientras dure esta sesión.
      </div>
    </div>
  );
}
