function parseCanchas(sede) {
  const m = (sede || "").match(/(\d+)\s*cancha/i);
  return m ? parseInt(m[1]) : 1;
}

// Desempate según el Reglamento Cordobeses Juegan 2026 (fútbol, art. 5.1 / 4.1), para dos o más empatados en puntos:
// 1) resultado/puntos entre sí, 2) diferencia de gol entre sí, 3) goles a favor entre sí, 4) menos goles en contra entre sí,
// 5) lo mismo con todos los partidos de la zona, 6) sorteo (se marca a mano con ✋).
function ordenarReglamento(filas, partidos, resultados) {
  const leer = (pt) => {
    const r = resultados[pt.key] || resultados[pt.legacyKey] || resultados[pt.legacyReverseKey];
    if (!r || r.gl === "" || r.gv === "" || r.gl == null || r.gv == null) return null;
    const gl = parseInt(r.gl), gv = parseInt(r.gv);
    return isNaN(gl) || isNaN(gv) ? null : [gl, gv];
  };
  const entreSi = (grupo) => {
    const set = new Set(grupo.map((f) => f.equipo)), st = {};
    grupo.forEach((f) => (st[f.equipo] = { pts: 0, gf: 0, gc: 0 }));
    partidos.forEach((pt) => {
      if (!set.has(pt.local) || !set.has(pt.visitante)) return;
      const g = leer(pt); if (!g) return;
      const L = st[pt.local], V = st[pt.visitante];
      L.gf += g[0]; L.gc += g[1]; V.gf += g[1]; V.gc += g[0];
      if (g[0] > g[1]) L.pts += 3; else if (g[0] < g[1]) V.pts += 3; else { L.pts++; V.pts++; }
    });
    return st;
  };
  const porPuntos = {};
  filas.forEach((f) => (porPuntos[f.pts] = porPuntos[f.pts] || []).push(f));
  return Object.keys(porPuntos).map(Number).sort((a, b) => b - a).flatMap((pts) => {
    const grupo = porPuntos[pts];
    if (grupo.length === 1) return grupo;
    const m = entreSi(grupo);
    return grupo.slice().sort((a, b) => {
      const A = m[a.equipo], B = m[b.equipo];
      return (B.pts - A.pts) || ((B.gf - B.gc) - (A.gf - A.gc)) || (B.gf - A.gf) || (A.gc - B.gc)
        || (b.dg - a.dg) || (b.gf - a.gf) || (a.gc - b.gc) || a.equipo.localeCompare(b.equipo);
    });
  });
}

function tablaPosiciones(equipos, partidos, resultados, ordenManual, reglamento) {
  const tabla = {};
  equipos.forEach((eq) => (tabla[eq] = { equipo: eq, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0 }));
  partidos.forEach((partido) => {
    const r = resultados[partido.key] || resultados[partido.legacyKey] || resultados[partido.legacyReverseKey];
    if (!r || r.gl === "" || r.gv === "" || r.gl == null || r.gv == null) return;
    const gl = parseInt(r.gl), gv = parseInt(r.gv);
    if (isNaN(gl) || isNaN(gv)) return;
    const L = tabla[partido.local], V = tabla[partido.visitante];
    L.pj++; V.pj++;
    L.gf += gl; L.gc += gv;
    V.gf += gv; V.gc += gl;
    if (gl > gv) { L.g++; V.p++; }
    else if (gl < gv) { V.g++; L.p++; }
    else { L.e++; V.e++; }
  });
  const filasCalc = Object.values(tabla).map((t) => ({ ...t, dg: t.gf - t.gc, pts: t.g * 3 + t.e }));
  const ordenadaAutomatica = reglamento
    ? ordenarReglamento(filasCalc, partidos, resultados)
    : filasCalc.sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf);
  // Clasificación manual: si se marcaron equipos a mano, van primero (en ese orden) y
  // el resto de la tabla sigue calculándose y ordenándose automáticamente por resultados.
  if (ordenManual && ordenManual.length) {
    const enManual = new Set(ordenManual);
    const primero = ordenManual.map((nombre) => ordenadaAutomatica.find((t) => t.equipo === nombre)).filter(Boolean);
    const resto = ordenadaAutomatica.filter((t) => !enManual.has(t.equipo));
    return [...primero, ...resto];
  }
  return ordenadaAutomatica;
}

function CrucesPanel({ jornada, equiposActivos, config, setConfig, sorteo, setSorteo, resultados, setResultado, onDarDeBaja, C, soloLectura = false }) {
  const numZonas = Math.max(1, parseInt(config?.numZonas) || 1);
  const numCanchas = Math.max(1, parseInt(config?.numCanchas) || parseCanchas(jornada.sede));
  const formato = config?.formato || "todos";

  const bolsa = sorteo?.bolsa || null;
  const orden = sorteo?.orden || [];
  const asignacion = {};
  orden.forEach((eq, i) => (asignacion[eq] = i % numZonas));
  const manual = sorteo?.manual || {};

  // Zonas "de verdad": si ya se editaron a mano (agregar/mover/dar de baja dentro de una
  // zona), esa es la fuente de la verdad; si no, se calculan como siempre a partir del
  // orden de sorteo (reparto 1→N→1). Editar una zona nunca toca a las demás.
  const zonasAuto = Array.from({ length: numZonas }, (_, zi) => orden.filter((_, i) => i % numZonas === zi));
  const zonasManual = sorteo?.zonas || null;
  const zonas = zonasManual || zonasAuto;

  const actualizarZonas = (nuevasZonas, extra) => {
    setSorteo({ ...sorteo, zonas: nuevasZonas, ...(extra || {}) });
  };

  const agregarAZona = (zi, equipo) => {
    if (!equipo) return;
    const base = zonasManual || zonasAuto;
    if (base.some((z) => z.includes(equipo))) return;
    actualizarZonas(base.map((z, i) => (i === zi ? [...z, equipo] : z.slice())));
  };

  const moverDeZona = (equipo, ziOrigen, ziDestino) => {
    if (ziOrigen === ziDestino || ziDestino === "") return;
    const destino = parseInt(ziDestino);
    const base = zonasManual || zonasAuto;
    actualizarZonas(base.map((z, i) => {
      if (i === ziOrigen) return z.filter((e) => e !== equipo);
      if (i === destino) return [...z, equipo];
      return z.slice();
    }));
  };

  const darDeBajaDeZona = (equipo, zi) => {
    if (!window.confirm(`¿Dar de baja a "${equipo}" de la ZONA ${zi + 1}?\n\nSe saca solo de esta zona; las demás zonas no se modifican, y los partidos/resultados ya cargados entre las demás instituciones se mantienen.`)) return;
    const base = zonasManual || zonasAuto;
    const nuevasZonas = base.map((z, i) => (i === zi ? z.filter((e) => e !== equipo) : z.slice()));
    const nuevoManual = manual[zi]?.includes(equipo) ? { ...manual, [zi]: manual[zi].filter((e) => e !== equipo) } : manual;
    actualizarZonas(nuevasZonas, { manual: nuevoManual });
    if (onDarDeBaja) onDarDeBaja(equipo);
  };

  const toggleClasificadoManual = (zi, equipo) => {
    const actuales = manual[zi] || [];
    const nuevos = actuales.includes(equipo) ? actuales.filter((e) => e !== equipo) : [...actuales, equipo];
    setSorteo({ ...sorteo, manual: { ...manual, [zi]: nuevos } });
  };

  const restablecerAutomatico = (zi) => {
    const m = { ...manual };
    delete m[zi];
    setSorteo({ ...sorteo, manual: m });
  };

  const iniciarSorteo = () => {
    const mezclado = FixtureCordobeses.distribuirSinMismaInstitucion(equiposActivos, numZonas);
    setSorteo({ bolsa: mezclado, orden: [] });
  };

  const distribuirAutomatico = () => {
    const mezclado = FixtureCordobeses.distribuirSinMismaInstitucion(equiposActivos, numZonas);
    setSorteo({ bolsa: [], orden: mezclado });
  };

  const sacarEquipo = () => {
    if (!bolsa || bolsa.length === 0) return;
    const [saliente, ...resto] = bolsa;
    setSorteo({ bolsa: resto, orden: [...orden, saliente] });
  };

  const hayResultadosCargados = Object.values(resultados || {}).some(
    (r) => r && ((r.gl !== undefined && r.gl !== "") || (r.gv !== undefined && r.gv !== ""))
  );
  const reiniciar = () => {
    const aviso = hayResultadosCargados
      ? "⚠️ Ya hay resultados cargados en esta jornada. Si volvés a armar el sorteo, esos resultados van a seguir guardados pero es probable que ya no se puedan ver asociados a los partidos nuevos. Esta acción no se puede deshacer fácilmente.\n\n¿Seguro que querés volver a armar el sorteo?"
      : "¿Seguro que querés volver a armar el sorteo? Se va a borrar la distribución en zonas actual.";
    if (!window.confirm(aviso)) return;
    setSorteo({ bolsa: null, orden: [] });
  };

  // si se agregó o bajó un equipo después de armar el sorteo, lo mandamos de nuevo a la bolsa
  // (o queda disponible para sumarlo a mano a una zona puntual con el selector de abajo)
  const enSorteo = new Set([...(bolsa || []), ...zonas.flat()]);
  const pendientesDeBolsa = equiposActivos.filter((e) => !enSorteo.has(e));

  const ultimoSacado = orden[orden.length - 1];

  return (
    <div style={{ background: "#F7F8FA", borderRadius: 8, padding: 12, marginTop: 8 }}>
      {!soloLectura && <>
      <div className="solo-coordinador" style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", marginBottom: 10 }}>
        <label style={{ fontSize: 11, color: C.sub, display: "flex", alignItems: "center", gap: 6 }}>
          Zonas
          <input type="number" min="1" value={config?.numZonas === "" ? "" : numZonas} onFocus={(e) => e.target.select()} onChange={(e) => setConfig({ ...config, numZonas: e.target.value === "" ? "" : Math.max(1, parseInt(e.target.value) || 1) })} onBlur={() => { if (config?.numZonas === "") setConfig({ ...config, numZonas: 1 }); }} style={{ width: 46, fontSize: 12, padding: "3px 6px", borderRadius: 5, border: `1px solid ${C.border}` }} />
        </label>
        <label style={{ fontSize: 11, color: C.sub, display: "flex", alignItems: "center", gap: 6 }}>
          Canchas disponibles
          <input type="number" min="1" value={config?.numCanchas === "" ? "" : numCanchas} onFocus={(e) => e.target.select()} onChange={(e) => setConfig({ ...config, numCanchas: e.target.value === "" ? "" : Math.max(1, parseInt(e.target.value) || 1) })} onBlur={() => { if (config?.numCanchas === "") setConfig({ ...config, numCanchas: parseCanchas(jornada.sede) }); }} style={{ width: 46, fontSize: 12, padding: "3px 6px", borderRadius: 5, border: `1px solid ${C.border}` }} />
        </label>
        <label style={{ fontSize: 11, color: C.sub, display: "flex", alignItems: "center", gap: 6 }}>
          Formato
          <select value={formato} onChange={(e) => setConfig({ ...config, formato: e.target.value })} style={{ fontSize: 11, padding: "4px 7px", borderRadius: 5, border: `1px solid ${C.border}`, background: "#fff" }}>
            <option value="todos">Todos contra todos</option>
            <option value="dos">2 partidos por equipo</option>
          </select>
        </label>
        <span style={{ fontSize: 11, color: C.sub }}>{equiposActivos.length} equipos activos · {formato === "dos" ? "cada equipo juega 2 partidos; clasifica el 1.º por tabla" : `van entrando a las zonas 1→${numZonas}→1… en el orden que salen`}</span>
      </div>

      {!bolsa ? (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={iniciarSorteo} disabled={equiposActivos.length === 0} style={{ fontSize: 12, padding: "8px 16px", borderRadius: 8, border: "none", background: C.primario, color: "#fff", fontWeight: 700, cursor: "pointer" }}>
            🎱 Sorteo en vivo, uno por uno
          </button>
          <button onClick={distribuirAutomatico} disabled={equiposActivos.length === 0} style={{ fontSize: 12, padding: "8px 16px", borderRadius: 8, border: `1px solid ${C.primario}`, background: "#fff", color: C.primario, fontWeight: 700, cursor: "pointer" }}>
            ⚡ Distribuir automáticamente, todo junto
          </button>
        </div>
      ) : bolsa.length === 0 && orden.length > 0 ? (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
            <Badge color="#fff" bg={C.verde}>✓ Distribución lista</Badge>
            {pendientesDeBolsa.length > 0 && (
              <span style={{ fontSize: 11, color: C.amarillo }}>+ {pendientesDeBolsa.length} equipo{pendientesDeBolsa.length > 1 ? "s" : ""} nuevo(s) sin asignar</span>
            )}
            <button onClick={reiniciar} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: `1px solid ${C.border}`, background: "#fff", color: C.sub, cursor: "pointer" }}>↺ Volver a armar</button>
          </div>
          {pendientesDeBolsa.length > 0 && (
            <button onClick={() => setSorteo({ bolsa: pendientesDeBolsa, orden })} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: "none", background: C.amarillo, color: "#fff", cursor: "pointer", marginBottom: 12 }}>
              Sortear los equipos nuevos
            </button>
          )}
        </div>
      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
            <button onClick={sacarEquipo} disabled={bolsa.length === 0} style={{ fontSize: 13, padding: "10px 20px", borderRadius: 8, border: "none", background: bolsa.length ? C.verde : "#C9CDD3", color: "#fff", fontWeight: 800, cursor: bolsa.length ? "pointer" : "default" }}>
              🎱 Sacar el próximo equipo
            </button>
            <span style={{ fontSize: 12, color: C.sub }}>Quedan {bolsa.length} en la bolsa</span>
            {pendientesDeBolsa.length > 0 && (
              <span style={{ fontSize: 11, color: C.amarillo }}>+ {pendientesDeBolsa.length} equipo{pendientesDeBolsa.length > 1 ? "s" : ""} nuevo(s) sin meter en la bolsa</span>
            )}
            <button onClick={reiniciar} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: `1px solid ${C.border}`, background: "#fff", color: C.sub, cursor: "pointer" }}>↺ Reiniciar sorteo</button>
          </div>

          {pendientesDeBolsa.length > 0 && (
            <button onClick={() => setSorteo({ bolsa: [...bolsa, ...pendientesDeBolsa], orden })} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: "none", background: C.amarillo, color: "#fff", cursor: "pointer", marginBottom: 12 }}>
              Meter los nuevos en la bolsa
            </button>
          )}

          {ultimoSacado && (
            <div style={{ background: C.primario, color: "#fff", borderRadius: 10, padding: "14px 18px", textAlign: "center", marginBottom: 14 }}>
              <div style={{ fontSize: 10, opacity: 0.8, letterSpacing: 1, marginBottom: 4 }}>SALIÓ</div>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{ultimoSacado}</div>
              <div style={{ fontSize: 11, opacity: 0.85, marginTop: 4 }}>→ Zona {((orden.length - 1) % numZonas) + 1}</div>
            </div>
          )}
        </>
      )}
      </>}

      {soloLectura && !zonas.some((z) => z.length > 0) && (
        <div style={{ fontSize: 12, color: C.sub, fontStyle: "italic" }}>Todavía no se armó el fixture de esta fecha.</div>
      )}

      {zonas.some((z) => z.length > 0) && (
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(numZonas, 2)}, minmax(260px, 1fr))`, gap: 10, marginTop: 4, overflowX: "auto", WebkitOverflowScrolling: "touch", paddingBottom: 6 }}>
          {zonas.map((equipos, zi) => {
            const partidos = partidosDeZona(equipos, zi, numZonas, numCanchas, formato);
            const tabla = tablaPosiciones(equipos, partidos, resultados, manual[zi], jornada.instancia === "PROVINCIAL");
            const clasificacionManualActiva = manual[zi] && manual[zi].length > 0;
            const otrasZonas = zonas.map((_, i) => i).filter((i) => i !== zi);
            return (
              <div key={zi} style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, padding: 10 }}>
                {/* El título "ZONA N (x)" tiene que ser hijo DIRECTO del recuadro de la zona: los scripts de
                    "Ganadores" y "Fase final" buscan ese texto y leen los resultados de su contenedor. */}
                <div style={{ fontSize: 11, fontWeight: 800, color: C.primario, marginBottom: 6 }}>ZONA {zi + 1} ({equipos.length})</div>
                {clasificacionManualActiva && <div style={{ marginBottom: 6 }}><Badge color="#fff" bg={C.provincial}>✋ Clasificación manual</Badge></div>}
                {equipos.map((eq, i) => (
                  <div key={eq} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: eq === ultimoSacado ? C.verde : C.ink, fontWeight: eq === ultimoSacado ? 700 : 400, marginBottom: 3 }}>
                    <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{i + 1}. {eq}</span>
                    {!soloLectura && numZonas > 1 && (
                      <select
                        className="solo-coordinador"
                        defaultValue=""
                        onChange={(e) => { moverDeZona(eq, zi, e.target.value); e.target.value = ""; }}
                        title={`Mover "${eq}" a otra zona`}
                        style={{ fontSize: 9, padding: "2px 3px", borderRadius: 4, border: `1px solid ${C.border}`, color: C.sub, background: "#fff" }}
                      >
                        <option value="">⇄ Mover…</option>
                        {otrasZonas.map((i) => <option key={i} value={i}>a Zona {i + 1}</option>)}
                      </select>
                    )}
                    {!soloLectura && (
                      <button
                        onClick={() => darDeBajaDeZona(eq, zi)}
                        title={`Dar de baja a "${eq}" de esta zona`}
                        style={{ fontSize: 9, padding: "2px 6px", borderRadius: 4, border: `1px solid ${C.rojo}`, background: "#fff", color: C.rojo, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}
                      >
                        Dar de baja
                      </button>
                    )}
                  </div>
                ))}

                {!soloLectura && (
                  <select
                    className="solo-coordinador"
                    defaultValue=""
                    onChange={(e) => { agregarAZona(zi, e.target.value); e.target.value = ""; }}
                    disabled={pendientesDeBolsa.length === 0}
                    style={{ width: "100%", marginTop: 6, fontSize: 10, padding: "5px 6px", borderRadius: 5, border: `1px dashed ${C.border}`, color: C.sub, background: "#fff" }}
                  >
                    <option value="">{pendientesDeBolsa.length ? "+ Agregar colegio a esta zona…" : "Sin colegios pendientes de asignar"}</option>
                    {pendientesDeBolsa.map((eq) => <option key={eq} value={eq}>{eq}</option>)}
                  </select>
                )}

                {equipos.length >= 2 && (
                  <>
                    <div style={{ marginTop: 8, borderTop: `1px solid ${C.border}`, paddingTop: 6 }}>
                      <div style={{ fontSize: 9, color: C.sub, fontWeight: 700, marginBottom: 4 }}>PARTIDOS Y RESULTADO</div>
                      {partidos.map((p) => {
                        const r = resultados[p.key] || resultados[p.legacyKey] || resultados[p.legacyReverseKey] || {};
                        return (
                          <div key={p.key} style={{ fontSize: 10, color: C.ink, marginBottom: 5, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
                            <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.local} <span style={{ color: C.sub }}>vs</span> {p.visitante}</span>
                            <input type="number" min="0" value={r.gl ?? ""} onChange={(e) => setResultado(p.key, "gl", e.target.value)} readOnly={soloLectura} disabled={soloLectura} style={{ width: 28, fontSize: 10, padding: "2px 3px", borderRadius: 4, border: `1px solid ${C.border}`, textAlign: "center", color: C.ink, opacity: 1, background: soloLectura ? "#F7F8FA" : "#fff" }} />
                            <span style={{ color: C.sub }}>-</span>
                            <input type="number" min="0" value={r.gv ?? ""} onChange={(e) => setResultado(p.key, "gv", e.target.value)} readOnly={soloLectura} disabled={soloLectura} style={{ width: 28, fontSize: 10, padding: "2px 3px", borderRadius: 4, border: `1px solid ${C.border}`, textAlign: "center", color: C.ink, opacity: 1, background: soloLectura ? "#F7F8FA" : "#fff" }} />
                            <span style={{ color: C.primario, fontWeight: 700, fontSize: 9, whiteSpace: "nowrap" }}>R{p.ronda} · C{p.cancha}</span>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ marginTop: 8, borderTop: `1px solid ${C.border}`, paddingTop: 6 }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, marginBottom: 4 }}>
                        <div style={{ fontSize: 9, color: C.sub, fontWeight: 700 }}>TABLA DE POSICIONES</div>
                        {!soloLectura && clasificacionManualActiva && (
                          <button onClick={() => restablecerAutomatico(zi)} style={{ fontSize: 9, padding: "2px 6px", borderRadius: 4, border: `1px solid ${C.border}`, background: "#fff", color: C.sub, cursor: "pointer" }}>↺ Automático</button>
                        )}
                      </div>
                      <table style={{ width: "100%", fontSize: 9, color: C.ink, borderCollapse: "collapse" }}>
                        <thead>
                          <tr style={{ color: C.sub, textAlign: "center" }}>
                            <th style={{ textAlign: "left", fontWeight: 600 }}>Equipo</th>
                            <th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th>{!soloLectura && <th></th>}
                          </tr>
                        </thead>
                        <tbody>
                          {tabla.map((t, ti) => {
                            const clasifica = ti < (jornada.ganadores || 1);
                            const esManual = manual[zi]?.includes(t.equipo);
                            return (
                              <tr key={t.equipo} style={{ textAlign: "center", background: clasifica ? (esManual ? C.provincialClaro : "#EAF6EE") : "transparent" }}>
                                <td style={{ textAlign: "left", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 90, fontWeight: clasifica ? 700 : 400 }}>{t.equipo}</td>
                                <td>{t.pj}</td><td>{t.g}</td><td>{t.e}</td><td>{t.p}</td><td>{t.gf}</td><td>{t.gc}</td><td>{t.dg}</td><td style={{ fontWeight: 800 }}>{t.pts}</td>
                                {!soloLectura && (
                                  <td>
                                    <button
                                      onClick={() => toggleClasificadoManual(zi, t.equipo)}
                                      title={esManual ? "Quitar clasificación manual" : "Marcar como clasificado a mano"}
                                      style={{ fontSize: 9, padding: "1px 4px", borderRadius: 4, border: `1px solid ${esManual ? C.provincial : C.border}`, background: esManual ? C.provincial : "#fff", color: esManual ? "#fff" : C.sub, cursor: "pointer" }}
                                    >✋</button>
                                  </td>
                                )}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                      {!soloLectura && <div style={{ fontSize: 9, color: C.sub, marginTop: 4 }}>✋ marca/saca la clasificación manual de ese equipo. No reemplaza el cálculo automático por resultados: es una opción aparte, para los casos puntuales que lo necesiten.</div>}
                    </div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function EquipoRow({ equipo, estado, onDarDeBaja, onReactivar, onResultado, ramaColor, editable }) {
  const bajo = estado?.bajo;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", borderRadius: 6, background: bajo ? "#FBEAEA" : "#FAFAFB", opacity: bajo ? 0.75 : 1 }}>
      <span style={{ flex: 1, minWidth: 0, fontSize: 12, color: bajo ? C.rojo : C.ink, textDecoration: bajo ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
        {equipo}
      </span>
      {bajo && <Badge color="#fff" bg={C.rojo}>BAJÓ</Badge>}
      {editable && (bajo ? (
        <button onClick={onReactivar} style={{ fontSize: 10, padding: "5px 10px", borderRadius: 6, border: `1px solid ${C.verde}`, background: "#fff", color: C.verde, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>↺ Reactivar</button>
      ) : (
        <button onClick={onDarDeBaja} style={{ fontSize: 10, padding: "5px 10px", borderRadius: 6, border: `1px solid ${C.rojo}`, background: "#fff", color: C.rojo, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>Dar de baja</button>
      ))}
      <div style={{ pointerEvents: editable ? "auto" : "none", opacity: editable ? 1 : 0.8 }}><ResultadoInput value={estado?.resultado} onChange={onResultado} /></div>
    </div>
  );
}

  const zonas = sorteo?.zonas || zonasAuto;

  zonas.forEach((equipos, zi) => {
    const pts = partidosDeZona(equipos, zi, numZonas, numCanchas, formato);

    const completa = pts.length > 0 && pts.every((pt) => resultadoCargado(resultados[pt.key] || resultados[pt.legacyKey] || resultados[pt.legacyReverseKey]));
    const tabla = completa ? tablaPosiciones(equipos, pts, resultados, manual[zi], jornada.instancia === "PROVINCIAL") : [];

  });
  lista.sort((a, b) => a.ronda - b.ronda || a.cancha - b.cancha || String(a.zona).localeCompare(String(b.zona)));

  return lista;
}
async function generarPlanillasArbitros(jornada, config, sorteo, ramaLabel, resultados) {

    texto(esFinal ? pt.zona : `Partido ${nro} de ${partidos.filter((x) => x.ronda != null).length}`, cx, 19, 10, true, GRIS, { align: "center" });
    // Fila de datos
    const cols = [["Día", dia, 38], ["Instancia", instancia, 38], ["Predio", jornada.sede, 60], ["Cancha", pt.cancha ? String(pt.cancha) : "", 17], ["Zona", pt.zona, 26], ["Hora", "", 22], ["Partido", esFinal ? pt.zona : "N° " + nro, 26], ["Categoría", jornada.categoria, 25], ["Sexo", sexo, 25]];
    let x = M; const y0 = 26;
    cols.forEach(([t, v, w]) => {
      caja(x, y0, w, 7); caja(x, y0 + 7, w, 11);
      texto(t, x + w / 2, y0 + 5, 8, true, GRIS, { align: "center" });
      const lineas = ajustar(v, w - 2, 9);

      if (t === "Hora" && pt.ronda) texto("Ronda " + pt.ronda, x + w / 2, y0 + 16.5, 6.5, false, GRIS, { align: "center" });

      if (pt.r) texto(String(k ? pt.r.gv : pt.r.gl), ex + anchoE / 2, yE + 66, 120, true, AZUL, { align: "center" });

    });
    texto("vs", W / 2, yE + 52, 12, true, GRIS, { align: "center" });
    // Resultado y penales
    const yR = 146;
    texto("Resultado del partido:", M, yR + 6, 10, true);
    caja(M + 44, yR, 16, 9); texto("-", M + 63, yR + 6.5, 12, true); caja(M + 66, yR, 16, 9);
    texto("Penales:", M + 100, yR + 6, 10, true);
    caja(M + 118, yR, 14, 9); texto("-", M + 135, yR + 6.5, 12, true); caja(M + 138, yR, 14, 9);
    if (pt.r) {
      texto(String(pt.r.gl), M + 52, yR + 7, 13, true, AZUL, { align: "center" }); texto(String(pt.r.gv), M + 74, yR + 7, 13, true, AZUL, { align: "center" });
      if (Number(pt.r.gl) === Number(pt.r.gv) && pt.r.pl !== undefined && pt.r.pl !== "" && pt.r.pv !== undefined && pt.r.pv !== "") {
        texto(String(pt.r.pl), M + 125, yR + 7, 13, true, AZUL, { align: "center" }); texto(String(pt.r.pv), M + 145, yR + 7, 13, true, AZUL, { align: "center" });
      }
    }
    // Árbitros
    const yA = 162, tercio = (W - 2 * M) / 3;
    [["Árbitro/a:", 0], ["Asistente N° 1:", 1], ["Asistente N° 2:", 2]].forEach(([t, k]) => { caja(M + k * tercio, yA, tercio, 9); texto(t, M + k * tercio + 2, yA + 6, 8.5, true, GRIS); });
    // Informe
    caja(M, yA + 9, W - 2 * M, 18); texto("Informe:", M + 2, yA + 15, 8.5, true, GRIS);
    pdf.setDrawColor(200); pdf.line(M + 2, yA + 21, W - M - 2, yA + 21); pdf.setDrawColor(0);

    caja(M, yA + 27, (W - 2 * M) / 2, 10); texto("Veedor/a:", M + 2, yA + 33.5, 8.5, true, GRIS);

  const nombre = `Planillas_arbitros_${jornada.categoria}_${ramaLabel || jornada.rama}_${(jornada.fecha || "").replace("-", "_")}_${jornada.grupo || jornada.instancia}`

  pdf.save(nombre + ".pdf");
}

// hay que arrancar directo en el panel (sin la intro) y con la pestaña (rama) correcta
// ya seleccionada, para que la jornada pedida esté en pantalla desde el primer instante.
function jornadaPedidaPorUrl() {
  try {
    const params = new URLSearchParams(location.search);
    if (params.get("vista") !== "profes") return null;
    const id = params.get("jornada");
    if (!id) return null;
    const todas = [...DATOS_CORDOBESES.femenino, ...DATOS_CORDOBESES.masculino];
    return todas.find((j) => j.id === id) || null;
  } catch (e) {
    return null;
  }
}
